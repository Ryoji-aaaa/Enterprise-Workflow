name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7
      - name: Run all tests
        run: make test
      - name: Publish test summary
        if: always()
        run: |
          run_id="$(cat test-results/latest-run.txt)"
          cat "test-results/${run_id}/summary.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          if-no-files-found: error
          retention-days: 14
          path: test-results/

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Build frontend runtime image
        run: docker build --target runtime frontend
      - name: Build backend runtime image
        run: docker build --target runtime backend
      - name: Build optimized Keycloak image
        run: docker build -f keycloak/azure.Dockerfile .
      - name: Validate rendered local Keycloak realm
        run: |
          make setup
          make render-keycloak-config
          jq empty keycloak/generated/import/workflow-realm.json
