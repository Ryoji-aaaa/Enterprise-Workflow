name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v5
      - name: Run all tests
        run: make test
      - name: Verify the running stack and network boundaries
        run: make verify
      - name: Capture Compose logs after failure
        if: failure()
        run: docker compose logs --no-color > compose.log
      - name: Upload E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 14
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            compose.log
      - name: Stop test services
        if: always()
        run: docker compose --profile test down --remove-orphans

  container-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5
      - name: Build frontend runtime image
        run: docker build --target runtime frontend
      - name: Build backend runtime image
        run: docker build --target runtime backend
      - name: Build optimized Keycloak image
        run: docker build -f keycloak/azure.Dockerfile .
      - name: Validate rendered local Keycloak realm
        run: |
          make setup
          make render-keycloak-config
          jq empty keycloak/generated/import/workflow-realm.json
