spring:
  datasource:
    url: jdbc:h2:mem:workflow;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  sql:
    init:
      mode: never

workflow:
  security:
    issuer: http://localhost:8180/realms/workflow
    client-id: workflow-web
    allowed-email-domain: sdcj.co.jp
    identity-provider: keycloak
  notification:
    delivery-mode: local-mailpit
    from: no-reply@workflow.local
    cooldown: 15m
    dispatch-interval: 1h
    smtp:
      host: mailpit
      port: 1025
      auth: false
      starttls: false
  attachment:
    max-file-size: 10MB
    max-files-per-application: 10
    max-total-size-per-application: 30MB
    max-original-file-name-length: 255
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    storage:
      container-name: expense-evidence
      endpoint: https://127.0.0.1:10000/devstoreaccount1
      create-container: false
  document-analysis:
    enabled: false
    execution-mode: disabled
    max-file-size: 10MB
    max-original-file-name-length: 255
    retention: 7d
    retention-cleanup-interval: 1h
    retention-cleanup-batch-size: 50
    batch-size: 2
    dispatch-interval: 1h
    processing-timeout: 30m
    max-active-jobs-per-user: 2
    max-requests-per-user-per-hour: 20
    azure:
      managed-identity-client-id:
    document-intelligence:
      enabled: false
      endpoint:
      model-id: prebuilt-layout
      api-version: 2024-11-30
      analysis-timeout: 25m
    content-understanding:
      enabled: false
      endpoint:
      model-id: prebuilt-layout
      api-version: 2025-11-01
      analysis-timeout: 25m
    storage:
      endpoint: https://127.0.0.1:10000/devstoreaccount1
      input-container-name: document-analysis-input
      result-container-name: document-analysis-result
      create-containers: false
  seed:
    enabled: false
    admin-email: example.admin1@sdcj.co.jp
    user-email: example.user1@sdcj.co.jp

management:
  health:
    mail:
      enabled: false
