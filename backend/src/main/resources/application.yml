spring:
  application:
    name: workflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/workflow}
    username: ${SPRING_DATASOURCE_USERNAME:workflow}
    password: ${SPRING_DATASOURCE_PASSWORD:replace-with-workflow-db-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/workflow}
          jwk-set-uri: ${KEYCLOAK_INTERNAL_ISSUER:http://keycloak:8080/realms/workflow}/protocol/openid-connect/certs
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

workflow:
  deployment-environment: ${WORKFLOW_DEPLOYMENT_ENVIRONMENT:development}
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/workflow}
    client-id: ${KEYCLOAK_CLIENT_ID:workflow-web}
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:sdcj.co.jp}
    allowed-external-emails: ${ALLOWED_EXTERNAL_EMAILS:}
    identity-provider: keycloak
  notification:
    delivery-mode: ${WORKFLOW_NOTIFICATION_DELIVERY_MODE:disabled}
    from: ${MAIL_FROM:}
    cooldown: ${ACCESS_REQUEST_NOTIFICATION_COOLDOWN:15m}
    batch-size: ${WORKFLOW_NOTIFICATION_BATCH_SIZE:20}
    dispatch-interval: ${WORKFLOW_NOTIFICATION_DISPATCH_INTERVAL:2s}
    processing-timeout: ${WORKFLOW_NOTIFICATION_PROCESSING_TIMEOUT:5m}
    retry-delays: ${WORKFLOW_NOTIFICATION_RETRY_DELAYS:1m,5m,15m,1h}
    smtp:
      host: ${MAIL_HOST:}
      port: ${MAIL_PORT:0}
      username: ${MAIL_USERNAME:}
      password: ${MAIL_PASSWORD:}
      auth: ${MAIL_SMTP_AUTH:false}
      starttls: ${MAIL_SMTP_STARTTLS:false}
  attachment:
    max-file-size: 10MB
    max-files-per-application: 10
    max-total-size-per-application: 30MB
    max-original-file-name-length: 255
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    storage:
      container-name: ${AZURE_STORAGE_CONTAINER_NAME:expense-evidence}
      endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:}
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      create-container: ${ATTACHMENT_STORAGE_CREATE_CONTAINER:false}
  document-analysis:
    enabled: ${WORKFLOW_DOCUMENT_ANALYSIS_ENABLED:false}
    execution-mode: ${WORKFLOW_DOCUMENT_ANALYSIS_EXECUTION_MODE:disabled}
    max-file-size: 10MB
    max-original-file-name-length: 255
    retention: 7d
    retention-cleanup-interval: ${WORKFLOW_DOCUMENT_ANALYSIS_RETENTION_CLEANUP_INTERVAL:1h}
    retention-cleanup-batch-size: ${WORKFLOW_DOCUMENT_ANALYSIS_RETENTION_CLEANUP_BATCH_SIZE:50}
    batch-size: ${WORKFLOW_DOCUMENT_ANALYSIS_BATCH_SIZE:2}
    dispatch-interval: ${WORKFLOW_DOCUMENT_ANALYSIS_DISPATCH_INTERVAL:2s}
    processing-timeout: ${WORKFLOW_DOCUMENT_ANALYSIS_PROCESSING_TIMEOUT:30m}
    max-active-jobs-per-user: ${WORKFLOW_DOCUMENT_ANALYSIS_MAX_ACTIVE_JOBS_PER_USER:2}
    max-requests-per-user-per-hour: ${WORKFLOW_DOCUMENT_ANALYSIS_MAX_REQUESTS_PER_USER_PER_HOUR:20}
    auto-entry:
      review-confidence-threshold: ${DOCUMENT_ANALYSIS_AUTO_ENTRY_REVIEW_CONFIDENCE_THRESHOLD:0.60}
    azure:
      managed-identity-client-id: ${AZURE_DOCUMENT_ANALYSIS_CLIENT_ID:}
    document-intelligence:
      enabled: ${DOCUMENT_INTELLIGENCE_ENABLED:false}
      endpoint: ${DOCUMENT_INTELLIGENCE_ENDPOINT:}
      model-id: ${DOCUMENT_INTELLIGENCE_MODEL_ID:prebuilt-layout}
      api-version: ${DOCUMENT_INTELLIGENCE_API_VERSION:2024-11-30}
      analysis-timeout: ${DOCUMENT_INTELLIGENCE_ANALYSIS_TIMEOUT:25m}
    content-understanding:
      enabled: ${CONTENT_UNDERSTANDING_ENABLED:false}
      endpoint: ${CONTENT_UNDERSTANDING_ENDPOINT:}
      model-id: ${CONTENT_UNDERSTANDING_ANALYZER_ID:prebuilt-layout}
      api-version: ${CONTENT_UNDERSTANDING_API_VERSION:2025-11-01}
      analysis-timeout: ${CONTENT_UNDERSTANDING_ANALYSIS_TIMEOUT:25m}
      auto-entry-analyzer-id: ${CONTENT_UNDERSTANDING_AUTO_ENTRY_ANALYZER_ID:enterprise_workflow_auto_entry_v2.1.1}
      auto-entry-completion-model-deployment-name: ${CONTENT_UNDERSTANDING_AUTO_ENTRY_COMPLETION_DEPLOYMENT_NAME:auto-entry-gpt-5-2}
      auto-entry-embedding-model-deployment-name: ${CONTENT_UNDERSTANDING_AUTO_ENTRY_EMBEDDING_DEPLOYMENT_NAME:auto-entry-text-embedding-3-large}
    storage:
      endpoint: ${DOCUMENT_ANALYSIS_STORAGE_BLOB_ENDPOINT:}
      connection-string: ${DOCUMENT_ANALYSIS_STORAGE_CONNECTION_STRING:${AZURE_STORAGE_CONNECTION_STRING:}}
      managed-identity-client-id: ${DOCUMENT_ANALYSIS_STORAGE_MANAGED_IDENTITY_CLIENT_ID:}
      input-container-name: ${DOCUMENT_ANALYSIS_INPUT_CONTAINER_NAME:document-analysis-input}
      result-container-name: ${DOCUMENT_ANALYSIS_RESULT_CONTAINER_NAME:document-analysis-result}
      create-containers: ${DOCUMENT_ANALYSIS_STORAGE_CREATE_CONTAINERS:false}
  seed:
    enabled: true
    automatic: ${WORKFLOW_SEED_AUTOMATIC:true}
    admin-email: ${DEV_ADMIN_EMAIL:example.admin1@sdcj.co.jp}
    user-email: ${DEV_USER_EMAIL:example.user1@sdcj.co.jp}
  manual-seed:
    enabled: ${WORKFLOW_MANUAL_SEED_ENABLED:false}
