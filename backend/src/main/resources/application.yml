spring:
  application:
    name: workflow-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/workflow}
    username: ${SPRING_DATASOURCE_USERNAME:workflow}
    password: ${SPRING_DATASOURCE_PASSWORD:replace-with-workflow-db-password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/workflow}
          jwk-set-uri: ${KEYCLOAK_INTERNAL_ISSUER:http://keycloak:8080/realms/workflow}/protocol/openid-connect/certs
  mail:
    host: ${MAIL_HOST:mailpit}
    port: ${MAIL_PORT:1025}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db
      show-details: never

workflow:
  deployment-environment: ${WORKFLOW_DEPLOYMENT_ENVIRONMENT:development}
  security:
    issuer: ${KEYCLOAK_ISSUER:http://localhost:8180/realms/workflow}
    client-id: ${KEYCLOAK_CLIENT_ID:workflow-web}
    allowed-email-domain: ${ALLOWED_EMAIL_DOMAIN:sdcj.co.jp}
    identity-provider: keycloak
  notification:
    from: ${MAIL_FROM:no-reply@workflow.local}
    cooldown: ${ACCESS_REQUEST_NOTIFICATION_COOLDOWN:15m}
  attachment:
    max-file-size: 10MB
    max-files-per-application: 10
    max-total-size-per-application: 30MB
    max-original-file-name-length: 255
    allowed-content-types:
      - application/pdf
      - image/jpeg
      - image/png
    storage:
      container-name: ${AZURE_STORAGE_CONTAINER_NAME:expense-evidence}
      endpoint: ${AZURE_STORAGE_BLOB_ENDPOINT:}
      connection-string: ${AZURE_STORAGE_CONNECTION_STRING:}
      create-container: ${ATTACHMENT_STORAGE_CREATE_CONTAINER:false}
  seed:
    enabled: true
    automatic: ${WORKFLOW_SEED_AUTOMATIC:true}
    admin-email: ${DEV_ADMIN_EMAIL:example.admin1@sdcj.co.jp}
    user-email: ${DEV_USER_EMAIL:example.user1@sdcj.co.jp}
  manual-seed:
    enabled: ${WORKFLOW_MANUAL_SEED_ENABLED:false}
