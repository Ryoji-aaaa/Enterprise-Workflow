name: ${COMPOSE_PROJECT_NAME:-workflow}

services:
  frontend:
    build:
      context: ./frontend
      target: development
      args:
        NODE_VERSION: ${NODE_VERSION:-24.18.0}
    environment:
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-ワークフローシステム}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-replace-with-at-least-32-random-characters}
      BETTER_AUTH_RATE_LIMIT_ENABLED: "false"
      BACKEND_INTERNAL_URL: ${BACKEND_INTERNAL_URL:-http://backend:8080}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/workflow}
      KEYCLOAK_INTERNAL_URL: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-workflow}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-workflow-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-replace-with-client-secret}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    depends_on:
      backend:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    volumes:
      - ./frontend/src:/workspace/src
      - ./frontend/public:/workspace/public
    networks:
      - public-network
      - application-network

  backend:
    build:
      context: ./backend
      target: runtime
      args:
        JAVA_VERSION: ${JAVA_VERSION:-21}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.16}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${WORKFLOW_DB_NAME:-workflow}
      SPRING_DATASOURCE_USERNAME: ${WORKFLOW_DB_USER:-workflow}
      SPRING_DATASOURCE_PASSWORD: ${WORKFLOW_DB_PASSWORD:-replace-with-workflow-db-password}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/workflow}
      KEYCLOAK_INTERNAL_ISSUER: ${KEYCLOAK_INTERNAL_URL:-http://keycloak:8080}/realms/${KEYCLOAK_REALM:-workflow}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-workflow-web}
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-sdcj.co.jp}
      ALLOWED_EXTERNAL_EMAILS: ${ALLOWED_EXTERNAL_EMAILS:-guest00@example.com,guest01@example.com,guest02@example.com,guest03@example.com}
      WORKFLOW_NOTIFICATION_DELIVERY_MODE: local-mailpit
      WORKFLOW_DEPLOYMENT_ENVIRONMENT: development
      MAIL_HOST: ${MAIL_HOST:-mailpit}
      MAIL_PORT: ${MAIL_PORT:-1025}
      MAIL_FROM: ${MAIL_FROM:-no-reply@workflow.local}
      ACCESS_REQUEST_NOTIFICATION_COOLDOWN: ${ACCESS_REQUEST_NOTIFICATION_COOLDOWN:-15m}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-example.admin1@sdcj.co.jp}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-example.user1@sdcj.co.jp}
      SPRING_PROFILES_ACTIVE: development
      AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;"
      ATTACHMENT_STORAGE_CREATE_CONTAINER: "true"
      WORKFLOW_DOCUMENT_ANALYSIS_ENABLED: "true"
      WORKFLOW_DOCUMENT_ANALYSIS_EXECUTION_MODE: fake
      DOCUMENT_INTELLIGENCE_ENABLED: "true"
      CONTENT_UNDERSTANDING_ENABLED: "true"
      DOCUMENT_ANALYSIS_STORAGE_CREATE_CONTAINERS: "true"
    healthcheck:
      test: ["CMD", "bash", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      azurite:
        condition: service_healthy
    networks:
      - application-network
      - database-network

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:${AZURITE_VERSION:-3.36.0}
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --blobPort
      - "10000"
      - --location
      - /data
      - --skipApiVersionCheck
    volumes:
      - azurite-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:10000/devstoreaccount1?comp=list').then(()=>process.exit(0)).catch(()=>process.exit(1))
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - application-network

  postgres:
    image: postgres:${POSTGRES_VERSION:-18.4}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-replace-with-postgres-admin-password}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      WORKFLOW_DB_NAME: ${WORKFLOW_DB_NAME:-workflow}
      WORKFLOW_DB_USER: ${WORKFLOW_DB_USER:-workflow}
      WORKFLOW_DB_PASSWORD: ${WORKFLOW_DB_PASSWORD:-replace-with-workflow-db-password}
      KEYCLOAK_DB_NAME: ${KEYCLOAK_DB_NAME:-keycloak}
      KEYCLOAK_DB_USER: ${KEYCLOAK_DB_USER:-keycloak}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-replace-with-keycloak-db-password}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - database-network

  keycloak-realm-init:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.0}
    user: "0"
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - >-
        install -o 1000 -g 0 -m 0440
        /source/workflow-realm.json
        /target/workflow-realm.json
    network_mode: none
    volumes:
      - ${KEYCLOAK_GENERATED_DIRECTORY:-./keycloak/generated}/import/workflow-realm.json:/source/workflow-realm.json:ro
      - keycloak-import:/target

  keycloak:
    image: quay.io/keycloak/keycloak:${KEYCLOAK_VERSION:-26.7.0}
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${KEYCLOAK_DB_NAME:-keycloak}
      KC_DB_USERNAME: ${KEYCLOAK_DB_USER:-keycloak}
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:-replace-with-keycloak-db-password}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-replace-with-admin-password}
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME: ${KEYCLOAK_EXTERNAL_URL:-http://localhost:8180}
    volumes:
      - keycloak-import:/opt/keycloak/data/import:ro
      - ./keycloak/scripts/healthcheck.sh:/opt/keycloak/healthcheck.sh:ro
    ports:
      - "${KEYCLOAK_HOST_PORT:-8180}:8080"
    healthcheck:
      test: ["CMD", "bash", "/opt/keycloak/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      keycloak-realm-init:
        condition: service_completed_successfully
    networks:
      - public-network
      - database-network

  keycloak-init:
    image: workflow-keycloak-init:${KEYCLOAK_VERSION:-26.7.0}
    build:
      context: .
      dockerfile: keycloak/init.Dockerfile
    profiles:
      - init
    environment:
      ALLOWED_EMAIL_DOMAIN: ${ALLOWED_EMAIL_DOMAIN:-sdcj.co.jp}
      ALLOWED_EXTERNAL_EMAILS: ${ALLOWED_EXTERNAL_EMAILS:-guest00@example.com,guest01@example.com,guest02@example.com,guest03@example.com}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-replace-with-admin-password}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-workflow-web}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-workflow}
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER:-http://localhost:8180/realms/workflow}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-example.admin1@sdcj.co.jp}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-example.user1@sdcj.co.jp}
      DEV_PENDING_EMAIL: ${DEV_PENDING_EMAIL:-example.pending1@sdcj.co.jp}
      DEV_SEED_PASSWORD: ${DEV_SEED_PASSWORD:-password}
      GUEST_SEED_PASSWORD: ${GUEST_SEED_PASSWORD:-guest-password}
    volumes:
      - ./keycloak/scripts/configure-keycloak.sh:/opt/workflow/configure-keycloak.sh:ro
      - ./keycloak/scripts/check-keycloak.sh:/opt/workflow/check-keycloak.sh:ro
      - ./keycloak/development-users.tsv:/opt/workflow/development-users.tsv:ro
      - ./keycloak/guest-users.tsv:/opt/workflow/guest-users.tsv:ro
    entrypoint: []
    command:
      - /opt/workflow/configure-keycloak.sh
    depends_on:
      keycloak:
        condition: service_healthy
    networks:
      - public-network

  mailpit:
    image: axllent/mailpit:${MAILPIT_VERSION:-v1.30.5}
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:8025/readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    networks:
      - public-network
      - application-network

volumes:
  postgres-data:
  azurite-data:
  keycloak-import:

networks:
  public-network:
  application-network:
    internal: true
  database-network:
    internal: true
