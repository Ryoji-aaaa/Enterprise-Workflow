services:
  backend-test:
    image: ${BACKEND_TEST_IMAGE:-workflow-backend-test:manual}
    build:
      context: ./backend
      target: test-runtime
      args:
        JAVA_VERSION: ${JAVA_VERSION:-21}
        MAVEN_VERSION: ${MAVEN_VERSION:-3.9.16}
        TEST_UID: ${TEST_UID:-1000}
        TEST_GID: ${TEST_GID:-1000}
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    volumes:
      - ${TEST_RUN_DIRECTORY:-./test-results/manual}:/test-results
      - ./tests/fixtures/staging-test-personas.json:/workspace/tests/fixtures/staging-test-personas.json:ro
    network_mode: none

  frontend-test:
    image: ${FRONTEND_TEST_IMAGE:-workflow-frontend-test:manual}
    build:
      context: ./frontend
      target: test-runtime
      args:
        NODE_VERSION: ${NODE_VERSION:-24.18.0}
        TEST_UID: ${TEST_UID:-1000}
        TEST_GID: ${TEST_GID:-1000}
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    environment:
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BACKEND_INTERNAL_URL: http://backend:8080
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-workflow}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-workflow-web}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ${TEST_RUN_DIRECTORY:-./test-results/manual}:/test-results
    networks:
      - public-network

  test-report:
    image: ${TEST_REPORT_IMAGE:-workflow-test-report:local}
    build:
      context: ./tools/test/report
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.14}
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    volumes:
      - ${TEST_RUN_DIRECTORY:-./test-results/manual}:/test-results
    network_mode: none

  keycloak-init:
    image: ${TEST_KEYCLOAK_INIT_IMAGE:-workflow-keycloak-init-test:manual}
    user: "${TEST_UID:-1000}:${TEST_GID:-1000}"
    volumes:
      - ${TEST_RUN_DIRECTORY:-./test-results/manual}:/test-results

  e2e:
    image: ${E2E_TEST_IMAGE:-workflow-e2e-test:manual}
    build:
      context: ./tests/e2e
      args:
        NODE_VERSION: ${NODE_VERSION:-24.18.0}
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-1.62.0}
    user: "${E2E_UID:-1000}:${E2E_GID:-1000}"
    init: true
    shm_size: 1gb
    environment:
      HOME: /tmp
      BASE_URL: ${BETTER_AUTH_URL}
      KEYCLOAK_URL: ${KEYCLOAK_EXTERNAL_URL}
      MAILPIT_URL: http://localhost:${MAILPIT_UI_PORT}
      PLAYWRIGHT_JUNIT_OUTPUT: /test-results/raw/junit/e2e/junit.xml
      PLAYWRIGHT_JSON_OUTPUT: /test-results/raw/e2e/report.json
      PLAYWRIGHT_OUTPUT_DIR: /test-results/diagnostics/e2e/results
      PLAYWRIGHT_HTML_OUTPUT: /test-results/diagnostics/e2e/html
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-example.admin1@sdcj.co.jp}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-password}
      DEV_USER_EMAIL: ${DEV_USER_EMAIL:-example.user1@sdcj.co.jp}
      DEV_USER_PASSWORD: ${DEV_USER_PASSWORD:-password}
      DEV_PENDING_EMAIL: ${DEV_PENDING_EMAIL:-example.pending1@sdcj.co.jp}
      DEV_PENDING_PASSWORD: ${DEV_PENDING_PASSWORD:-password}
      DEV_PRESIDENT_EMAIL: president@sdcj.co.jp
      DEV_PRESIDENT_PASSWORD: ${DEV_SEED_PASSWORD:-password}
      DEV_PART_TIME_EMAIL: example.parttime1@sdcj.co.jp
      DEV_PART_TIME_PASSWORD: ${DEV_SEED_PASSWORD:-password}
      DEV_EXPENSE_USER_EMAIL: first-si-sales-section.user@sdcj.co.jp
      DEV_EXPENSE_MANAGER_EMAIL: first-si-sales-section.head@sdcj.co.jp
      DEV_EXPENSE_DIVISION_HEAD_EMAIL: first-si-division.head@sdcj.co.jp
      DEV_EXPENSE_ACCOUNTING_EMAIL: accounting-section.user@sdcj.co.jp
      DEV_EXPENSE_OUTSIDER_EMAIL: second-si-sales-section.head@sdcj.co.jp
      DEV_EXPENSE_PASSWORD: ${DEV_SEED_PASSWORD:-password}
    volumes:
      - ${TEST_RUN_DIRECTORY:-./test-results/manual}:/test-results
    network_mode: host
